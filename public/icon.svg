<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Monochrome Black Background with Squircle -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  
  <!-- Subtle Contrast Border for Dark/Light Mode -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Inner circular guide for safe zone -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Warung Roof / Canopy (High Contrast White) -->
  <path d="M 120 196 L 256 120 L 392 196 L 372 228 L 140 228 Z" fill="#ffffff" />
  <path d="M 140 228 C 140 246 162 252 176 238 C 190 252 212 252 226 238 C 240 252 262 252 276 238 C 290 252 312 252 326 238 C 340 252 362 246 372 228" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <path d="M 176 196 L 176 228 M 256 156 L 256 228 M 336 196 L 336 228" stroke="#09090b" stroke-width="5" />

  <!-- Cashier / Storefront Body -->
  <rect x="150" y="246" width="212" height="152" rx="18" fill="#ffffff" />
  
  <!-- Register Display (Black Inset with White Font) -->
  <rect x="178" y="270" width="156" height="56" rx="10" fill="#09090b" stroke="#27272a" stroke-width="2" />
  <text x="256" y="309" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">Rp 0</text>
  
  <!-- Keypad Buttons (High Contrast Monochrome) -->
  <circle cx="196" cy="356" r="10" fill="#27272a" />
  <circle cx="226" cy="356" r="10" fill="#27272a" />
  <circle cx="256" cy="356" r="10" fill="#27272a" />
  <circle cx="286" cy="356" r="10" fill="#27272a" />
  <circle cx="316" cy="356" r="10" fill="#09090b" stroke="#27272a" stroke-width="2" />

  <!-- Badge / Star for WarungKu (Monochrome White & Black) -->
  <circle cx="384" cy="136" r="36" fill="#ffffff" stroke="#09090b" stroke-width="4" />
  <text x="384" y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#09090b" text-anchor="middle">★</text>
</svg>
