<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner circle highlight -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Warung Roof / Canopy -->
  <path d="M 120 200 L 256 128 L 392 200 L 372 230 L 140 230 Z" fill="#ffffff" />
  <path d="M 140 230 C 140 248 162 254 176 240 C 190 254 212 254 226 240 C 240 254 262 254 276 240 C 290 254 312 254 326 240 C 340 254 362 248 372 230" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <path d="M 176 200 L 176 230 M 256 160 L 256 230 M 336 200 L 336 230" stroke="#059669" stroke-width="5" />

  <!-- Cashier / Storefront Body -->
  <rect x="150" y="246" width="212" height="150" rx="16" fill="#ffffff" />
  
  <!-- Register Display & Coin -->
  <rect x="180" y="270" width="152" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="3" />
  <text x="256" y="308" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#047857" text-anchor="middle">Rp 0</text>
  
  <!-- Keypad buttons -->
  <circle cx="195" cy="354" r="10" fill="#cbd5e1" />
  <circle cx="225" cy="354" r="10" fill="#cbd5e1" />
  <circle cx="256" cy="354" r="10" fill="#cbd5e1" />
  <circle cx="286" cy="354" r="10" fill="#cbd5e1" />
  <circle cx="317" cy="354" r="10" fill="#10b981" />

  <!-- Badge / Star for Warungku -->
  <circle cx="380" cy="140" r="38" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="5" />
  <text x="380" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">★</text>
</svg>
